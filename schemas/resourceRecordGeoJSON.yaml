$schema: 'https://json-schema.org/draft/2020-12/schema'
title: EOEPCA metadata profile
description: EOEPCA metadata profile

allOf:
  - $ref: 'https://raw.githubusercontent.com/opengeospatial/ogcapi-records/refs/heads/master/core/openapi/schemas/recordGeoJSON.yaml'
  - type: object
    properties:
      conformsTo:
        type: array
        allOf:
          - contains:
              const: http://eoepca.org/spec/eomp/1/conf/core
          - contains:
              const: http://www.opengis.net/spec/ogcapi-records-1/1.0/conf/record-core
      stac_extensions:
        type: array
        description: A list of implemented STAC Extensions. The list consists of URLs to JSON Schema files that can be used for validation
        uniqueItems: true
        items:
           type: string
           description: Reference to a JSON Schema
           format: iri
      properties:
          type: object
          properties:
              type:
                  type: string
                  description: EOEPCA resource type
                  enum:
                      - dataset
                      - experiment
                      - service
                      - process
                      - workflow
              title:
                  $ref: 'https://raw.githubusercontent.com/opengeospatial/ogcapi-records/refs/heads/master/core/openapi/schemas/recordCommonProperties.yaml#/properties/title'
              created:
                  $ref: 'https://raw.githubusercontent.com/opengeospatial/ogcapi-records/refs/heads/master/core/openapi/schemas/recordCommonProperties.yaml#/properties/created'
          required:
              - type
              - title
              - created
    required:
        - stac_extensions
        - links
