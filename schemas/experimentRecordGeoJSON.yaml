$schema: 'https://json-schema.org/draft/2020-12/schema'
title: EOEPCA metadata profile - experiment extension
description: EOEPCA metadata profile - experiment extension

allOf:
  - $ref: 'resourceRecordGeoJSON.yaml'
  - type: object
    properties:
      conformsTo:
        type: array
        allOf:
          - contains:
              const: http://eoepca.org/spec/eomp/1/conf/experiment
          - contains:
              const: http://www.opengis.net/spec/ogcapi-records-1/1.0/conf/record-core
        items:
           type: string
           description: Reference to a JSON Schema
           format: iri
      properties:
          type: object
          properties:
              type:
                  type: string
                  description: EOEPCA resource type
                  const: experiment
